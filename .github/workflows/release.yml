name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash build.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent "Сетеметр.app" Setemeter.zip
          shasum -a 256 Setemeter.zip > Setemeter.zip.sha256
          # DMG для ручной установки: приложение + ярлык на /Applications
          rm -rf dmg && mkdir dmg
          ditto "Сетеметр.app" "dmg/Сетеметр.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Сетеметр" -srcfolder dmg -ov -format UDZO Setemeter.dmg

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            build/Setemeter.dmg build/Setemeter.zip build/Setemeter.zip.sha256 \
            --title "Сетеметр $TAG" \
            --generate-notes
