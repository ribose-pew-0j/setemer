name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash build.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent "Сетеметр.app" Setemeter.zip
          shasum -a 256 Setemeter.zip > Setemeter.zip.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            build/Setemeter.zip build/Setemeter.zip.sha256 \
            --title "Сетеметр $TAG" \
            --generate-notes
